services:
  - type: web
    name: retainwise-employee-attrition-insights
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /_stcore/health
    autoDeployTrigger: 'off'
    envVars:
      - key: PORT
        value: 8501
